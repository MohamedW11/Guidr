openapi: 3.1.0
info:
  title: Guidr V1 API Specification
  version: 1.0.0
  description: Multi-Tenant Student Life Platform API Specification
servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: System Health check
  - name: auth
    description: Authentication & Multi-tenant User Sessions
  - name: organizations
    description: Organization Tenants Management
  - name: users
    description: School Roster & User Domain Operations
  - name: imports
    description: CSV User Roster Bulk Imports
  - name: children
    description: Parent Child-Switching & Family Operations
  - name: locations
    description: School Campus Locations Catalog
  - name: clubs
    description: School Clubs & Advisor Assignments
  - name: memberships
    description: Two-Stage Club Membership Approval Workflow & Lifecycle
  - name: operations
    description: Schedules, Sessions, Attendance, Announcements, Resources, and Badges

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: User login
      responses:
        "200":
          description: Login successful

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: User logout
      responses:
        "200":
          description: Logout successful

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user identity and organization memberships
      responses:
        "200":
          description: Active user session info

  /organizations:
    get:
      operationId: listUserOrganizations
      tags: [organizations]
      summary: List organizations accessible by current user
      responses:
        "200":
          description: Organization tenants list

  /organizations/{orgId}/users:
    get:
      operationId: listSchoolUsers
      tags: [users]
      summary: List school users filtered by role
      responses:
        "200":
          description: Roster users list

  /organizations/{orgId}/locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List school campus locations
      responses:
        "200":
          description: Locations list
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a campus location
      responses:
        "201":
          description: Location created

  /organizations/{orgId}/clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: List clubs in catalog
      responses:
        "200":
          description: Clubs catalog
    post:
      operationId: createClub
      tags: [clubs]
      summary: Create a school club
      responses:
        "201":
          description: Club created

  /organizations/{orgId}/clubs/explore:
    get:
      operationId: exploreClubs
      tags: [clubs]
      summary: Student discovery feed for grade-eligible active clubs
      responses:
        "200":
          description: Eligible active clubs

  /organizations/{orgId}/clubs/{clubId}/join:
    post:
      operationId: joinClub
      tags: [memberships]
      summary: Student submits join request for a club (PENDING_PARENT_APPROVAL)
      responses:
        "201":
          description: Join request submitted

  /organizations/{orgId}/club-memberships:
    get:
      operationId: listClubMemberships
      tags: [memberships]
      summary: Query club memberships filtered by role, status, clubId, studentId
      responses:
        "200":
          description: List of club memberships

  /organizations/{orgId}/club-memberships/{id}/parent-approve:
    post:
      operationId: parentApproveMembership
      tags: [memberships]
      summary: Parent approves student request (PENDING_PARENT_APPROVAL -> PENDING_ADVISOR_APPROVAL)
      responses:
        "200":
          description: Parent approval granted

  /organizations/{orgId}/club-memberships/{id}/parent-reject:
    post:
      operationId: parentRejectMembership
      tags: [memberships]
      summary: Parent rejects student request (PENDING_PARENT_APPROVAL -> PARENT_REJECTED)
      responses:
        "200":
          description: Parent rejection processed

  /organizations/{orgId}/club-memberships/{id}/advisor-approve:
    post:
      operationId: advisorApproveMembership
      tags: [memberships]
      summary: Advisor approves request (PENDING_ADVISOR_APPROVAL -> ACTIVE)
      responses:
        "200":
          description: Advisor approval granted and membership activated

  /organizations/{orgId}/club-memberships/{id}/advisor-reject:
    post:
      operationId: advisorRejectMembership
      tags: [memberships]
      summary: Advisor rejects request (PENDING_ADVISOR_APPROVAL -> ADVISOR_REJECTED)
      responses:
        "200":
          description: Advisor rejection processed

  /organizations/{orgId}/club-memberships/{id}/withdraw:
    post:
      operationId: withdrawMembership
      tags: [memberships]
      summary: Student or parent withdraws membership request
      responses:
        "200":
          description: Membership withdrawn

  /organizations/{orgId}/clubs/{clubId}/schedules:
    get:
      operationId: listClubSchedules
      tags: [operations]
      summary: List recurring club schedules
      responses:
        "200":
          description: List of club schedules
    post:
      operationId: createClubSchedule
      tags: [operations]
      summary: Create recurring schedule entry
      responses:
        "201":
          description: Schedule created

  /organizations/{orgId}/clubs/{clubId}/sessions:
    get:
      operationId: listClubSessions
      tags: [operations]
      summary: List club session occurrences
      responses:
        "200":
          description: List of sessions
    post:
      operationId: createClubSession
      tags: [operations]
      summary: Schedule single session occurrence
      responses:
        "201":
          description: Session created

  /organizations/{orgId}/club-sessions/{sessionId}/attendance:
    get:
      operationId: getSessionAttendance
      tags: [operations]
      summary: Get active members roster and attendance status for a session
      responses:
        "200":
          description: Attendance roster
    post:
      operationId: recordSessionAttendance
      tags: [operations]
      summary: Record or update attendance for session members
      responses:
        "200":
          description: Attendance updated

  /organizations/{orgId}/clubs/{clubId}/announcements:
    get:
      operationId: listAnnouncements
      tags: [operations]
      summary: List club announcements
      responses:
        "200":
          description: List of announcements
    post:
      operationId: postAnnouncement
      tags: [operations]
      summary: Post a club broadcast announcement
      responses:
        "201":
          description: Announcement published

  /organizations/{orgId}/clubs/{clubId}/resources:
    get:
      operationId: listResources
      tags: [operations]
      summary: List club resources and document links
      responses:
        "200":
          description: List of resources
    post:
      operationId: createResource
      tags: [operations]
      summary: Upload or share a club resource link
      responses:
        "201":
          description: Resource uploaded

  /organizations/{orgId}/badges:
    get:
      operationId: listBadges
      tags: [operations]
      summary: List school badge templates
      responses:
        "200":
          description: List of badge templates
    post:
      operationId: createBadge
      tags: [operations]
      summary: Create a badge template
      responses:
        "201":
          description: Badge created

  /organizations/{orgId}/students/{studentId}/badges:
    get:
      operationId: getStudentBadges
      tags: [operations]
      summary: Fetch badges awarded to student
      responses:
        "200":
          description: List of student badges
    post:
      operationId: awardStudentBadge
      tags: [operations]
      summary: Award a badge to student
      responses:
        "201":
          description: Badge awarded


